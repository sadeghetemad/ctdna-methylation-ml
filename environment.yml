name: ctdna10
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python=3.11
  # data handling
  - pandas>=2.2
  - numpy>=1.26
  - openpyxl 
  # bioinformatics tools
  - fastqc
  - trim-galore
  - bismark>=3
  - bowtie2
  - samtools
  - multiqc
  # nfcore mode (main.py --mode nfcore); containers need Docker/Singularity separately
  - nextflow>=24.10.5
  # analysis / ML notebooks
  - scipy
  - scikit-learn>=1.4
  - matplotlib
  - jupyterlab
  - ipykernel
