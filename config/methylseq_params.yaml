# ------------------------------------------------------------
# nf-core/methylseq parameters for the ELSA cohort (nfcore mode).
#
# Replaces steps 01-07 of classic mode. The settings follow those
# scripts as closely as nf-core/methylseq allows, so the coverage
# files can go straight into 08_build_features.py.
#
# Paths (input, outdir, fasta, index, targets) are passed on the
# command line by scripts/nf_methylseq.py and are not set here.
# ------------------------------------------------------------

# Alignment: Bismark + Bowtie2, as in 05_align.py
aligner: bismark
igenomes_ignore: true

# Trimming: Trim Galore, Q20 (default) and min length 20, as in 02_trim.py
length_trim: 20

# Methylation extraction, as in 07_extract_methylation.py
comprehensive: true
cytosine_report: true
no_overlap: true

# nf-core ignores 2 bp at the R2 ends by default; 07 ignores nothing.
# Set to 0 so that the features are comparable. Check the M-bias
# plots in MultiQC before changing them.
ignore_r1: 0
ignore_r2: 0
ignore_3prime_r1: 0
ignore_3prime_r2: 0

# Targeted panel: methylation calls restricted to the ELSA regions
run_targeted_sequencing: true
collecthsmetrics: false

# QC
run_preseq: false
run_qualimap: false
